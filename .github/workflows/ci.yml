name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # macos-26 is not being assigned a hosted runner, so the job is cancelled
    # before it starts. macos-15 is an Apple Silicon image and matches the
    # package's macOS 15.1 minimum.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build -c release --arch arm64 -Xswiftc -warnings-as-errors
      - name: Self-test
        run: "$(swift build -c release --arch arm64 --show-bin-path)/removemacai selftest"
      - name: App bundle
        run: tools/build-app.sh
